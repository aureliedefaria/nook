<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nook</title>
<meta name="theme-color" content="#F4EDE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F4EDE2; --card:#FFFBF4; --ink:#3B2F27; --soft:#8A7663; --line:#E2D5C2;
  --accent:#B5654A; --accent-ink:#FFFBF4;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);
  -webkit-tap-highlight-color:transparent}
header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;letter-spacing:.5px}
.date{color:var(--soft);font-size:14px}
main{flex:1;width:100%;max-width:440px;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-top:24px}
section{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:34px 26px 30px;box-shadow:0 10px 30px -18px rgba(80,50,30,.35);min-height:240px;
  display:flex;flex-direction:column;justify-content:center}
.card.small{min-height:0;padding:22px 22px 20px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);margin-bottom:16px}
.prompt{font-family:var(--serif);font-size:23px;line-height:1.45;margin:0}
.small .prompt{font-size:19px}
.msg{font-family:var(--serif);font-size:21px;line-height:1.5;text-align:center;margin:0}
.small .msg{font-size:18px}
.sub{color:var(--soft);font-size:15px;text-align:center;margin:14px 0 0;line-height:1.5}
.back{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:repeating-linear-gradient(45deg,#F9F2E7 0 10px,#FFFBF4 10px 20px)}
.back .n{font-family:var(--serif);font-size:64px;color:var(--accent);line-height:1}
button{font:inherit;border:0;border-radius:999px;padding:17px 22px;font-size:17px;font-weight:600;
  width:100%;cursor:pointer;transition:transform .12s ease, opacity .2s}
button:active{transform:scale(.98)}
.primary{background:var(--accent);color:var(--accent-ink)}
.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);padding:15px 22px;font-size:16px}
.ghost{background:none;color:var(--soft);font-weight:500;font-size:15px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.choose-h{font-family:var(--serif);font-size:19px;text-align:center;margin:0;color:var(--soft)}
.pick{cursor:pointer;text-align:left}
.pick:active{transform:scale(.99)}
.pick .go{margin-top:14px;font-size:14px;font-weight:600;color:var(--accent)}
.sep{height:1px;background:var(--line);margin:4px 0}
.reveal{animation:flip .45s ease both}
@keyframes flip{from{opacity:0;transform:translateY(10px) rotateX(18deg)}to{opacity:1;transform:none}}
.count{color:var(--soft);font-size:13px;text-align:center;margin:0}
</style>
</head>
<body>
<header><h1>Nook</h1><span class="date" id="date"></span></header>
<main id="app"></main>
<script>
const KEY='nook-state-v1';
const MAX_OTHERS=2; // cartes proposées en plus quand une carte n'inspire pas
const $app=document.getElementById('app');
const today=()=>new Date().toLocaleDateString('sv-SE');
document.getElementById('date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function decode(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function fix(t){return t.replace(/ ([?!:;»])/g,' $1').replace(/« /g,'« ')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function putBack(deck,id){deck.splice(Math.floor(Math.random()*(deck.length+1)),0,id)}

/* S = paquet principal (même format qu'avant, rien n'est perdu) ; S.L = paquet des listes */
let S=load(), P={}, LP={};

/* range un paquet : retire ce qui n'existe plus ou est fait, ajoute les nouvelles cartes au hasard,
   remet au fond la carte d'un autre jour pas écrite, et dans le paquet les cartes d'un choix pas fait */
function tidy(D,pool,used){
  D.done=D.done||{}; D.deck=D.deck||[];
  if(used&&!D.seeded){used.forEach(id=>D.done[id]=true);D.seeded=true}
  const t=today();
  if(D.choice&&D.choice.on!==t){D.choice.ids.forEach(id=>{if(pool[id]&&!D.done[id]&&(!D.current||D.current.id!==id))D.deck.push(id)});D.choice=null}
  D.deck=D.deck.filter((id,i,a)=>pool[id]&&!D.done[id]&&a.indexOf(id)===i&&(!D.current||D.current.id!==id)&&!(D.choice&&D.choice.ids.includes(id)));
  const known=new Set(D.deck); if(D.current) known.add(D.current.id); if(D.choice) D.choice.ids.forEach(id=>known.add(id));
  shuffle(Object.keys(pool).filter(id=>!D.done[id]&&!known.has(id))).forEach(id=>putBack(D.deck,id));
  if(D.current&&D.current.on!==t){ if(pool[D.current.id]&&!D.done[D.current.id]) D.deck.push(D.current.id); D.current=null }
}

async function init(){
  let data;
  try{const r=await fetch('prompts.json',{cache:'no-cache'});data=await r.json()}
  catch(e){$app.innerHTML='<div class="card"><p class="msg">Impossible de charger les cartes.</p><p class="sub">Vérifie ta connexion puis rouvre Nook.</p></div>';return}
  decode(data.data).forEach(p=>{p.t=fix(p.t);P[p.id]=p});
  try{const r=await fetch('listes.json',{cache:'no-cache'});const ld=await r.json();decode(ld.data).forEach(p=>{p.t=fix(p.t);LP[p.id]=p})}catch(e){}
  S.L=S.L||{};
  tidy(S,P,data.used||[]); tidy(S.L,LP,null);
  save(S); render();
}

function left(D){return D.deck.length+(D.current?1:0)+(D.choice?D.choice.ids.length-1:0)}

/* ---------- carte du jour ---------- */
function mainHTML(t){
  if(S.lastDone===t)
    return `<div class="card reveal"><p class="msg">C'est écrit pour aujourd'hui.</p><p class="sub">Ta prochaine carte t'attend demain.</p></div>`;
  if(S.choice&&S.choice.on===t){
    return `<p class="choose-h">Choisis celle qui t'inspire</p>`+S.choice.ids.filter(id=>P[id]).map(id=>{const p=P[id];
      return `<div class="card small pick reveal" data-pick="${esc(id)}"><div class="tag">${esc(p.d)}</div><p class="prompt">${esc(p.t)}</p><div class="go">Celle-ci</div></div>`}).join('');
  }
  if(S.current&&S.current.on===t&&P[S.current.id]){
    const p=P[S.current.id];
    return `<div class="card reveal"><div class="tag">${esc(p.d)}</div><p class="prompt">${esc(p.t)}</p></div>
    <button class="primary" data-act="done">C'est écrit</button>`
    +(S.swapped!==t&&S.deck.length?`<button class="ghost" data-act="swap">Elle ne m'inspire pas</button>`:'');
  }
  if(!S.deck.length)
    return `<div class="card"><p class="msg">Tu as écrit toutes les cartes.</p><p class="sub">De nouvelles arriveront bientôt.</p></div>`;
  return `<div class="card back"><div class="n">n</div><p class="sub" style="margin:0">Ta carte du jour est prête.</p></div>
  <button class="primary" data-act="draw">Tirer ma carte</button>`;
}

/* ---------- carte liste (une par jour, si elle veut) ---------- */
function listHTML(t){
  const L=S.L;if(!Object.keys(LP).length)return '';
  if(L.lastDone===t)
    return `<div class="card small"><p class="msg">Ta liste du jour est écrite.</p></div>`;
  if(L.current&&L.current.on===t&&LP[L.current.id]){
    const p=LP[L.current.id];
    return `<div class="card small reveal"><div class="tag">Carte liste</div><p class="prompt">${esc(p.t)}</p></div>
    <button class="secondary" data-act="ldone">Ma liste est écrite</button>`;
  }
  if(!L.deck.length)return '';
  return `<button class="secondary" data-act="ldraw">Tirer une carte liste</button>`;
}

function render(){
  const t=today();
  $app.innerHTML=`<section>${mainHTML(t)}</section>`
    +(listHTML(t)?`<div class="sep"></div><section>${listHTML(t)}</section>`:'')
    +`<p class="count">${left(S)} cartes dans le paquet</p>`;
}

$app.addEventListener('click',e=>{
  const t=today();
  const pk=e.target.closest('[data-pick]');
  if(pk&&S.choice){const id=pk.getAttribute('data-pick');
    S.choice.ids.filter(x=>x!==id).forEach(x=>putBack(S.deck,x));
    S.current={id,on:t};S.choice=null;save(S);render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.getAttribute('data-act');
  if(a==='draw'){S.current={id:S.deck.shift(),on:t};save(S);render();return}
  if(a==='done'){S.done[S.current.id]=true;S.current=null;S.lastDone=t;save(S);render();return}
  if(a==='swap'){ // la carte du jour + au plus 2 autres, elle choisit
    const others=S.deck.splice(0,MAX_OTHERS);
    S.choice={on:t,ids:[S.current.id,...others]};S.current=null;S.swapped=t;save(S);render();return}
  if(a==='ldraw'){S.L.current={id:S.L.deck.shift(),on:t};save(S);render();return}
  if(a==='ldone'){S.L.done[S.L.current.id]=true;S.L.current=null;S.L.lastDone=t;save(S);render();return}
});

// si l'app reste ouverte après minuit
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Object.keys(P).length){
  tidy(S,P,null);tidy(S.L,LP,null);save(S);render()}});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script>
</body>
</html>
